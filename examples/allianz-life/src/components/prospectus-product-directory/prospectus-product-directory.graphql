query ProspectusProductDirectory($datasource: String!, $language: String!) {
  datasource: item(path: $datasource, language: $language) {
    id
    currentProducts: field(name: "currentProducts") {
      ... on MultilistField { targetItems { id productLink: field(name: "productLink") { jsonValue } } }
    }
    pastProducts: field(name: "pastProducts") {
      ... on MultilistField { targetItems { id productLink: field(name: "productLink") { jsonValue } } }
    }
  }
}
