# Keep the authored heading and meaningful More link. Release records are
# supplied automatically by the server-only SDK hook, never a selection list.
query NewsroomRecentReleasesData($datasource: String!, $language: String!) {
  datasource: item(path: $datasource, language: $language) {
    id
    heading: field(name: "heading") { jsonValue }
    moreLink: field(name: "moreLink") { jsonValue }
  }
}
