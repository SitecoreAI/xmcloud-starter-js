query SustainabilityCommitmentData($datasource: String!, $language: String!) {
  datasource: item(path: $datasource, language: $language) {
    id
    fieldCollection: fields { name jsonValue }
    children(first: 40) {
      total
      pageInfo { hasNext endCursor }
      results { id fieldCollection: fields { name jsonValue } }
    }
  }
}
