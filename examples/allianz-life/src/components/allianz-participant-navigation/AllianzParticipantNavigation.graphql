query AllianzParticipantNavigationQuery($datasource: String!, $language: String!) {
  datasource: item(path: $datasource, language: $language) {
    id
    heading: field(name: "tagline") { jsonValue }
    primaryNav: field(name: "primaryNav") {
      ... on MultilistField {
        targetItems {
          id
          title: field(name: "title") { jsonValue }
          link: field(name: "link") { jsonValue }
          children(first: 1) { total pageInfo { hasNext endCursor } }
        }
      }
    }
  }
}
