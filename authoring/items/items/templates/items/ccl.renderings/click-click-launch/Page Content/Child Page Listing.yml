              jsonValue
            }
            metadataDescription: field(name: "metadataDescription") {
              jsonValue
            }
            pageThumbnail: field(name: "pageThumbnail") {
              jsonValue
            }
            pageDisplayDate: field(name: "pageDisplayDate") {
              jsonValue
            }
          }
        }
      }
