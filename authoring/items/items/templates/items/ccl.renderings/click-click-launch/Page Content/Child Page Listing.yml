  Value: |
    query ChildPageListing($contextItem: String!, $language: String!) {
      datasource: item(path: $contextItem, language: $language) {
        id
        name
        children(hasLayout: true) {
          results {
            id
            name
            url {
              href: path
            }
            pageHeaderTitle: field(name: "pageHeaderTitle") {
              jsonValue
